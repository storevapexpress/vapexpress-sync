name: Sync iSeller ke Supabase
on:
  schedule:
    - cron: '*/10 * * * *'   # tiap 10 menit (cadangan; pemicu utama = cron-job.org tiap 10 menit)
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = normal · full = rekonsiliasi sebulan (pakai bulan=YYYY-MM) · grabonly = tarik histori Grab/Tokopedia (pakai bulan=YYYY-MM mulai, kosong=Januari)'
        default: 'auto'
        required: false
      bulan:
        description: 'Khusus mode=full: bulan yg mau direkonsiliasi (format YYYY-MM, mis. 2026-06). Kosong = bulan ini.'
        default: ''
        required: false
concurrency:
  group: sync-iseller
  cancel-in-progress: false  # JANGAN cancel run yg lagi jalan (biar selesai penuh, ga nyicil).
                             #   timeout-minutes di bawah yg jaga biar ga hang selamanya.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # auto-mati kalau kelamaan (run normal <3mnt; full window-sempit <15mnt; jaga2 30)
    steps:
      - name: Tarik order + refund terbaru iSeller -> Supabase
        env:
          ISELLER_CLIENT_ID: ${{ secrets.ISELLER_CLIENT_ID }}
          ISELLER_CLIENT_SECRET: ${{ secrets.ISELLER_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          BULAN: ${{ github.event.inputs.bulan }}
        run: |
          cat > sync.mjs <<'EOF'
          const CID=process.env.ISELLER_CLIENT_ID, CSEC=process.env.ISELLER_CLIENT_SECRET;
          const SUPA=process.env.SUPABASE_URL.replace(/\/$/,''), SR=process.env.SUPABASE_SERVICE_KEY;
          const sleep=ms=>new Promise(s=>setTimeout(s,ms));
          const SH={apikey:SR,Authorization:'Bearer '+SR};
          const tr=await fetch('https://isellershop.com/oauth/token',{method:'POST',headers:{Authorization:'Basic '+Buffer.from(CID+':'+CSEC).toString('base64'),'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=client_credentials'});
          if(!tr.ok){ console.error('Token gagal', tr.status, await tr.text()); process.exit(1); }
          const tj=await tr.json();
          const base=tj.resource_url.replace(/\/$/,'')+'/api/v2';
          const H={Authorization:'Bearer '+tj.access_token,'Content-Type':'application/json'};
          // created_after (ISO tanpa tz) + sort CreatedDate DESC -> order TERBARU di page 1.
          //   Jauh lebih hemat: ga perlu scan ribuan halaman dari belakang.
          //   ca = 'YYYY-MM-DDTHH:MM:SS' (WIB, karena time_zone:7).
          async function getPage(p,ca,cb){ const b={time_zone:7,page:p,sort:'CreatedDate',sort_direction:'DESC'}; if(ca) b.created_after=ca; if(cb) b.created_before=cb; for(let i=0;i<6;i++){ try{ const r=await fetch(base+'/GetOrders',{method:'POST',headers:H,body:JSON.stringify(b)}); if(r.ok) return await r.json(); }catch(e){} await sleep(2000);} return null; }
          async function getPageD(p,ca){ const b={time_zone:7,page:p,includes:'OrderDetails',sort:'CreatedDate',sort_direction:'DESC'}; if(ca) b.created_after=ca; for(let i=0;i<6;i++){ try{ const r=await fetch(base+'/GetOrders',{method:'POST',headers:H,body:JSON.stringify(b)}); if(r.ok) return await r.json(); }catch(e){} await sleep(2000);} return null; }
          async function getTx(p,ca){ const b={time_zone:7,page:p,page_size:5000,sort:'CreatedDate',sort_direction:'DESC'}; if(ca) b.created_after=ca; for(let i=0;i<6;i++){ try{ const r=await fetch(base+'/GetTransactions',{method:'POST',headers:H,body:JSON.stringify(b)}); if(r.ok) return await r.json(); }catch(e){} await sleep(2000);} return null; }
          // (dulu ada findLast/stGet/stSet buat scan halaman dari belakang — sekarang ga perlu,
          //  karena created_after + sort DESC langsung kasih order terbaru di page 1.)

          // ===== MODE grabonly: rekonsiliasi HISTORI Grab/Tokopedia (report_data) dari created_after input.
          //   Cuma narik GetTransactions (page_size 5000 -> sedikit halaman), saring Grab Mart/Tokopedia,
          //   lookup outlet dari order, MERGE ke report_data (ga overwrite). Skip order/refund/items -> ringan.
          //   Dipicu: MODE=grabonly, BULAN=YYYY-MM (mulai). Kosong -> Januari tahun ini.
          if((process.env.MODE||'')==='grabonly'){
            const bl=(process.env.BULAN||'').trim();
            const gStart=/^\d{4}-\d{2}$/.test(bl) ? (bl+'-01') : (new Date(Date.now()+7*3600*1000).toISOString().slice(0,4)+'-01-01');
            const gCa=gStart+'T00:00:00';
            const PT={ 'GRAB MART':'grabmart', 'TOKOPEDIA':'tokopedia' };
            console.log('MODE grabonly: tarik grab/toko sejak '+gStart);
            const gtx=[]; { let p=1, guard=0;
              while(guard++<600){ const r=await getTx(p,gCa); if(!r) break; const tt=r.transactions||[]; if(!tt.length) break;
                for(const t of tt){ const d=(t.transaction_date||'').slice(0,10);
                  if(t.type==='sale' && PT[t.payment_type_name] && d>=gStart){ gtx.push({ref:t.order_reference||'', date:d, amt:Number(t.amount)||0, ch:PT[t.payment_type_name]}); } }
                p++; }
              console.log('grabonly: '+gtx.length+' transaksi grab/toko dari '+(p-1)+' halaman'); }
            // lookup outlet per ref
            const uref=[...new Set(gtx.map(g=>g.ref))]; const omap={};
            for(let i=0;i<uref.length;i+=80){ const b=uref.slice(i,i+80); const il=b.map(x=>'"'+x.replace(/#/g,'%23')+'"').join(','); try{ const rr=await fetch(SUPA+'/rest/v1/iseller_orders?ref=in.('+il+')&select=ref,outlet&limit=5000',{headers:SH}); const jj=await rr.json(); for(const row of jj){ if(!omap[row.ref]) omap[row.ref]={outlet:row.outlet}; } }catch(e){} }
            const gt={ grabmart:{}, tokopedia:{} };
            for(const g of gtx){ const out=(omap[g.ref]||{}).outlet||'(Lainnya)'; const bo=gt[g.ch]; if(!bo[out]) bo[out]={}; if(!bo[out][g.date]) bo[out][g.date]=[0,0]; bo[out][g.date][0]+=g.amt; bo[out][g.date][1]+=1; }
            const stamp=new Date(Date.now()+7*3600*1000).toISOString().slice(0,16).replace('T',' ')+' WIB';
            for(const key of ['grabmart','tokopedia']){ const bo=gt[key]; if(!Object.keys(bo).length) continue;
              let old={}; try{ const rr=await fetch(SUPA+'/rest/v1/report_data?key=eq.'+key+'&select=data',{headers:SH}); const jj=await rr.json(); if(jj&&jj[0]&&jj[0].data&&jj[0].data.byOutlet) old=jj[0].data.byOutlet; }catch(e){}
              const merged=JSON.parse(JSON.stringify(old));
              for(const out in bo){ if(!merged[out]) merged[out]={}; for(const dt in bo[out]){ merged[out][dt]=bo[out][dt]; } }
              await fetch(SUPA+'/rest/v1/report_data',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:key, data:{updated:stamp, byOutlet:merged}})});
              console.log('OK '+key+': '+Object.keys(bo).length+' outlet (merged sejak '+gStart+')');
            }
            console.log('grabonly SELESAI.'); process.exit(0);
          }

          // ===== JENDELA SYNC =====
          // Normal: 2 hari (kemarin+hari ini) tiap 15 menit -> cepat & segar.
          // FULL (2x sehari ~02:xx & ~14:xx WIB, atau dipicu manual mode=full): tarik ulang
          //   sebulan penuh (dari 4 hari sebelum awal bulan) supaya order yang telat masuk
          //   / pembayaran yang baru dikonfirmasi di iSeller ikut ke-sync -> angka nyocok.
          //   (Order ditarik dulu semua, baru DELETE+INSERT di akhir ~1-2 menit -> blip minim.)
          const nowWIB=new Date(Date.now()+7*3600*1000);
          const _h=nowWIB.getUTCHours();
          const WIDE=(process.env.MODE==='full')||((_h===2 || _h===14) && nowWIB.getUTCMinutes()<15);
          const cd=new Date(nowWIB.getTime());
          // RUN CEPAT: cut = HARI INI (bukan H-1). Robot cuma refresh HARI INI & seterusnya -> data
          //   tanggal-tanggal lama AMAN, GA ke-timpa robot. Order hari ini sedikit -> ga mentok limit.
          // FULL: default dari tgl 1 bulan ini. Kalau input BULAN diisi (YYYY-MM) -> rekonsiliasi bulan itu.
          const BLN=(process.env.BULAN||'').trim();  // mis '2026-06'
          let fullEnd=null;  // batas akhir loop full (kalau bulan lampau = akhir bulan itu)
          if(WIDE){
            if(/^\d{4}-\d{2}$/.test(BLN)){
              cd.setUTCFullYear(+BLN.slice(0,4), +BLN.slice(5,7)-1, 1);
              // akhir bulan = tgl 0 bulan berikutnya
              const fe=new Date(Date.UTC(+BLN.slice(0,4), +BLN.slice(5,7), 0)); fullEnd=fe.toISOString().slice(0,10);
            } else { cd.setUTCDate(1); }
          }
          // else: cut = hari ini (ga di-mundur)
          const cut=cd.toISOString().slice(0,10);
          // created_after buat AMBIL data. Order bisa di-create/edit TELAT (order_date kemarin tapi
          //   created hari ini, atau sebaliknya) -> mundur 2 hari dari cut, cukup nangkep semua order
          //   yg order_date-nya masuk window (cut=H-1) TANPA kebanyakan data. PENTING: mundur JAUH
          //   (mis. 10 hari) bikin robot narik puluhan ribu order/ratusan halaman -> iSeller timeout
          //   di tengah -> ordersFail -> SKIP nulis -> data hari ini STUCK. 2 hari = ringan & aman.
          //   Filter simpan tetap order_date>=cut (cuma 2 hari yg disimpan). Owner: "sama persis iSeller".
          const caD=new Date(cd.getTime()); caD.setUTCDate(caD.getUTCDate()-2);
          const caCut=caD.toISOString().slice(0,10)+'T00:00:00';
          console.log('MODE '+(WIDE?'FULL (rekonsiliasi sebulan)':'cepat (refresh penuh 2 hari)')+' · cut='+cut+' · created_after='+caCut);

          // ===== 1) ORDERS ===== (created_after window + sort DESC, TANPA created_before)
          // KENAPA TANPA created_before: iSeller kelompokin per ORDER_DATE (tgl transaksi), tapi filter
          //   created_before itu per CREATED_DATE (tgl dibuat). Order transaksi 29 tapi di-close kasir 30
          //   -> created_before motong dia di dua-duanya -> order HILANG (29 turun 933->734). JADI: pakai
          //   1 window created_after aja (mundur cukup jauh), lalu SARING pakai order_date>=cut. Ga motong.
          // LIMIT 1235: iSeller mentok ~1235 order/query. Biar aman, run cepat window = 2 hari (cut=H-1,
          //   ca=H-3) -> max ~1000 order < 1235. Tanggal lama di-reconcile mode full (per potongan).
          // Ambil order dgn 1 window created_after (mulai dari 'ca'), saring order_date>=dFrom & <dTo.
          //   sort DESC + created_after cukup jauh -> nangkep order yg created telat. Filter pakai
          //   order_date (BUKAN created_before) -> GA MOTONG order yg created beda dari transaksi.
          //   Return {rows, fail}. dedup by ref di caller.
          async function pullOrders(ca, dFrom, dTo, cb){
            const out=[]; let fail=false, p=1, guard=0;
            while(guard++<600){
              const r=await getPage(p,ca,cb);
              if(!r){ fail=true; console.error('getPage gagal page '+p+' (ca='+ca+') -> ABORT'); break; }
              const o=r.orders||[]; if(!o.length) break;
              for(const x of o){ const d=(x.order_date||'').slice(0,10); if(d<dFrom||d>=dTo) continue;
                const isPaid=(x.status==='completed')||(x.payment_status==='paid');
                out.push({date:d, outlet:x.outlet_name||'', cashier:((x.cashier_first_name||'')+' '+(x.cashier_last_name||'')).trim(), customer:((x.customer_first_name||'')+' '+(x.customer_last_name||'')).trim(), phone:x.customer_phone_number||'', total:Number(x.total_amount)||0, status:x.status||'', paid:isPaid, ref:x.order_reference||'', channel:x.channel||''}); }
              p++;
            }
            return {rows:out, fail};
          }
          const today=nowWIB.toISOString().slice(0,10);
          const dTo=(()=>{ const t=new Date(nowWIB.getTime()); t.setUTCDate(t.getUTCDate()+1); return t.toISOString().slice(0,10); })();
          let rows=[], ordersFail=false;
          if(!WIDE){
            // RUN CEPAT: window 2 hari (cut..hari ini). ca=caCut (H-3). <1235 -> ga mentok limit.
            const rr=await pullOrders(caCut, cut, dTo);
            rows=rr.rows; ordersFail=rr.fail;
            console.log('orders: '+rows.length+' baris (order_date '+cut+'..'+today+') created_after='+caCut+(ordersFail?' [GAGAL - SKIP]':''));
          } else {
            // MODE FULL: rekonsiliasi PER-HARI (cut..hari ini). Tiap tanggal: created_after=tgl-3
            //   (nangkep created telat) lalu saring order_date==tgl. Window kecil per hari -> GA mentok
            //   limit 1235, saring pakai order_date -> GA motong. NULIS PER-HARI (DELETE+INSERT tiap
            //   tanggal langsung, BUKAN numpuk di akhir) -> kalau kepotong/timeout di tengah, tanggal yg
            //   udah kelar TETAP KESIMPEN. Dedup by ref per hari (anti dobel kalau ada bentrok).
            const fullTo=fullEnd||today;   // bulan lampau -> akhir bulan itu; bulan ini -> hari ini
            let dd=new Date(cut+'T00:00:00Z'), totFull=0;
            console.log('FULL range: '+cut+' .. '+fullTo);
            while(dd.toISOString().slice(0,10)<=fullTo){
              const day=dd.toISOString().slice(0,10);
              const dNext=new Date(dd.getTime()); dNext.setUTCDate(dNext.getUTCDate()+1); const dayNext=dNext.toISOString().slice(0,10);
              // created_after = tgl-3 (nangkep created telat). created_before = tgl+2 (LONGGAR: ga motong
              //   order yg created telat dikit, TAPI batesin window ~5 hari -> tiap query cuma sedikit
              //   halaman -> GA timeout. Tanpa created_before, query narik SAMPAI SEKARANG tiap tanggal
              //   -> Juni narik ribuan halaman -> 20mnt timeout.). Saring tetap order_date==tgl.
              const caD=new Date(dd.getTime()); caD.setUTCDate(caD.getUTCDate()-3); const ca=caD.toISOString().slice(0,10)+'T00:00:00';
              const cbD=new Date(dd.getTime()); cbD.setUTCDate(cbD.getUTCDate()+2); const cb=cbD.toISOString().slice(0,10)+'T00:00:00';
              const rr=await pullOrders(ca, day, dayNext, cb);
              if(rr.fail){ console.error('FULL gagal narik '+day+' -> SKIP tanggal ini, lanjut'); dd.setUTCDate(dd.getUTCDate()+1); continue; }
              // dedup by ref biar ga dobel
              const seen={}, dayRows=[]; for(const row of rr.rows){ if(row.ref && !seen[row.ref]){ seen[row.ref]=1; dayRows.push(row); } }
              // tulis PER-HARI: hapus tanggal ini dulu (non-refund), lalu insert fresh
              await fetch(SUPA+'/rest/v1/iseller_orders?date=eq.'+day+'&channel=neq.refund',{method:'DELETE',headers:SH});
              for(let i=0;i<dayRows.length;i+=500){ const ch=dayRows.slice(i,i+500); await fetch(SUPA+'/rest/v1/iseller_orders',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(ch)}); }
              totFull+=dayRows.length; console.log('  '+day+': '+dayRows.length+' order (ditulis)');
              dd.setUTCDate(dd.getUTCDate()+1);
            }
            console.log('orders(FULL): '+totFull+' baris total ditulis per-hari ('+cut+'..'+today+')');
            rows=[]; ordersFail=false;   // full udah nulis sendiri per-hari -> lewati blok tulis di bawah
          }
          // PROTEKSI (khusus RUN CEPAT): tulis (DELETE+INSERT) HANYA kalau tarik SUKSES PENUH.
          //   Narik window created_after + saring order_date -> ga motong. FULL udah nulis per-hari
          //   di atas (rows kosong -> blok ini di-skip otomatis buat full).
          //   Kalau fetch gagal di tengah -> SKIP tulis (data lama dipertahankan, tunggu run berikutnya).
          if(!WIDE && !ordersFail){
            // CUMA RUN CEPAT. (WIDE/full udah nulis per-hari di atas -> JANGAN masuk sini, kalau ga
            //   DELETE date>=cut + INSERT rows-kosong = HAPUS SEMUA DATA sebulan. Guard !WIDE wajib.)
            await fetch(SUPA+'/rest/v1/iseller_orders?date=gte.'+cut+'&channel=neq.refund',{method:'DELETE',headers:SH});
            for(let i=0;i<rows.length;i+=500){ const ch=rows.slice(i,i+500); await fetch(SUPA+'/rest/v1/iseller_orders',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(ch)}); }
            console.log('OK order: '+rows.length+' refresh penuh sejak '+cut);
          } else if(!WIDE){ console.error('SKIP tulis orders: fetch gagal di tengah. Data lama dipertahankan, tunggu run berikutnya.'); }

          // GUARD: kalau rekonsiliasi BULAN LAMPAU (input bulan diisi, fullEnd ada), CUMA benerin ORDER.
          //   Skip refund/grab/items -> biar GA ngerusak refund bulan lain (DELETE date>=cut bisa kena
          //   bulan setelahnya) & biar ringan. Order = yg dipermasalahin (omzet). Refund bulan lampau kecil.
          if(fullEnd){ console.log('Rekonsiliasi bulan lampau '+cut+'..'+(fullEnd)+': ORDER only, skip refund/grab/items. SELESAI.'); }
          else {
          // ===== 2) REFUNDS + GRAB/TOKO (dari GetTransactions) ===== (created_after + sort DESC)
          // GT_CUT: batas histori grab/toko. DULU '2026-01-01' (7 bulan) -> pas WIDE robot narik ratusan
          //   halaman transaksi -> TIMEOUT 10-20 menit -> di-cancel -> GA NULIS APA2 -> selisih ga kelar.
          //   FIX: WIDE cukup mundur ke AWAL BULAN BERJALAN (grab/toko bulan ini) -> ringan, ga timeout.
          //   Histori grab/toko bulan-bulan lalu sudah tersimpan & TIDAK dihapus (report_data numpuk).
          const _gm=new Date(nowWIB.getTime()); _gm.setUTCDate(1);
          const GT_CUT=_gm.toISOString().slice(0,10);   // awal bulan berjalan (mis. 2026-07-01)
          // created_after buat AMBIL: fast mundur 2 hari (caCut), WIDE dari awal bulan (biar grab/toko kekejar)
          const txCa = WIDE ? (GT_CUT+'T00:00:00') : caCut;
          const PT={ 'GRAB MART':'grabmart', 'TOKOPEDIA':'tokopedia' };
          const refs=[], seen={}, gtx=[];
          { let p=1, guard=0;
            while(guard++<600){ const r=await getTx(p,txCa); if(!r) break; const tt=r.transactions||[]; if(!tt.length) break;
              for(const t of tt){ const d=(t.transaction_date||'').slice(0,10);
                if(t.type==='refund' && d>=cut){ const id=String(t.transaction_id||''); if(!seen[id]){ seen[id]=1; refs.push({date:d, ref:t.order_reference||'', amount:Number(t.amount)||0}); } }
                else if(WIDE && t.type==='sale' && PT[t.payment_type_name] && d>=GT_CUT){ gtx.push({ref:t.order_reference||'', date:d, amt:Number(t.amount)||0, ch:PT[t.payment_type_name]}); }
              }
              p++;
            }
            console.log('tx: '+refs.length+' refund + '+gtx.length+' grab/toko dari '+(p-1)+' halaman (created_after='+txCa+')'); }
          // lookup outlet tiap ref (refund + grab/toko) dari order-nya
          const uref=[...new Set(refs.map(r=>r.ref).concat(gtx.map(g=>g.ref)))]; const omap={};
          for(let i=0;i<uref.length;i+=80){ const b=uref.slice(i,i+80); const il=b.map(x=>'"'+x.replace(/#/g,'%23')+'"').join(','); try{ const rr=await fetch(SUPA+'/rest/v1/iseller_orders?ref=in.('+il+')&select=ref,outlet,cashier&limit=5000',{headers:SH}); const jj=await rr.json(); for(const row of jj){ if(!omap[row.ref]) omap[row.ref]={outlet:row.outlet,cashier:row.cashier}; } }catch(e){} }
          const rrows=refs.map(r=>({date:r.date, outlet:(omap[r.ref]||{}).outlet||'', cashier:(omap[r.ref]||{}).cashier||'', customer:'', phone:'', total:-Math.abs(r.amount), status:'refund', paid:true, ref:r.ref, channel:'refund'}));
          await fetch(SUPA+'/rest/v1/iseller_orders?date=gte.'+cut+'&channel=eq.refund',{method:'DELETE',headers:SH});
          for(let i=0;i<rrows.length;i+=500){ const ch=rrows.slice(i,i+500); await fetch(SUPA+'/rest/v1/iseller_orders',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(ch)}); }
          console.log('OK refund: '+rrows.length+' sejak '+cut);

          // ===== 3) GRAB/TOKO -> tabel report_data (dibaca dashboard menu Report) — hanya WIDE =====
          if(WIDE){
            const gt={ grabmart:{}, tokopedia:{} };
            for(const g of gtx){ const out=(omap[g.ref]||{}).outlet||'(Lainnya)'; const bo=gt[g.ch]; if(!bo[out]) bo[out]={}; if(!bo[out][g.date]) bo[out][g.date]=[0,0]; bo[out][g.date][0]+=g.amt; bo[out][g.date][1]+=1; }
            const stamp=new Date(Date.now()+7*3600*1000).toISOString().slice(0,16).replace('T',' ')+' WIB';
            for(const key of ['grabmart','tokopedia']){ const bo=gt[key]; if(!Object.keys(bo).length) continue;
              // MERGE, JANGAN timpa: baca byOutlet LAMA dulu, gabung sama yg baru (per outlet per tanggal).
              //   Kalau ga di-merge, robot yg cuma narik bulan ini bakal HAPUS histori bulan lalu (grab/toko
              //   bulan lama ilang). Tanggal yg sama di-overwrite dgn angka baru (rekonsiliasi bener).
              let old={};
              try{ const rr=await fetch(SUPA+'/rest/v1/report_data?key=eq.'+key+'&select=data',{headers:SH}); const jj=await rr.json(); if(jj&&jj[0]&&jj[0].data&&jj[0].data.byOutlet) old=jj[0].data.byOutlet; }catch(e){}
              const merged=JSON.parse(JSON.stringify(old));
              for(const out in bo){ if(!merged[out]) merged[out]={}; for(const dt in bo[out]){ merged[out][dt]=bo[out][dt]; } }
              await fetch(SUPA+'/rest/v1/report_data',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:key, data:{updated:stamp, byOutlet:merged}})});
            }
            console.log('OK grab/toko (merged): grabmart '+Object.keys(gt.grabmart).length+' outlet · tokopedia '+Object.keys(gt.tokopedia).length+' outlet');
          }

          // ===== 4) ORDER ITEMS (produk per struk) — INCREMENTAL (nyicil per hari), buat Follow Up HOT =====
          // GetOrders + includes:"OrderDetails" -> order_details[] keisi. Tulis ke iseller_order_items (tabel terpisah).
          // Cuma refresh 3 HARI terakhir (nangkep order telat sync), TIDAK hapus histori lama -> data numpuk & ringan.
          // Histori awal ditarik sekali (script pull-items-now.ps1). HOT (belanja 13-14 hari lalu) sudah pasti ada dari cicilan hari2 sebelumnya.
          try{
            // Run biasa = 3 hari. WIDE/full = 7 hari (BUKAN awal bulan lagi -> awal bulan bikin
            //   getPageD narik ratusan halaman + OrderDetails -> TIMEOUT. Order-items cuma buat HOT
            //   (belanja 13-14 hari lalu) yg sudah pasti ada dari cicilan harian; 7 hari cukup buat self-heal.
            //   Histori items lama TIDAK disentuh. Isi histori pertama kali pakai pull-items-now.ps1.)
            const idCut=new Date(nowWIB.getTime());
            if(WIDE){ idCut.setUTCDate(idCut.getUTCDate()-7); } else { idCut.setUTCDate(idCut.getUTCDate()-3); }
            const iCut=idCut.toISOString().slice(0,10);
            // created_after buat AMBIL items: mundur 3 hari dari iCut (aman timezone/telat)
            const iCaD=new Date(idCut.getTime()); iCaD.setUTCDate(iCaD.getUTCDate()-3);
            const iCa=iCaD.toISOString().slice(0,10)+'T00:00:00';
            const items=[]; const seenRef={};
            { let p=1, guard=0;
              while(guard++<400){ const r=await getPageD(p,iCa); if(!r) break; const o=r.orders||[]; if(!o.length) break;
                for(const x of o){ const d=(x.order_date||'').slice(0,10); if(d<iCut) continue; if(x.payment_status!=='paid') continue;
                  const ref=x.order_reference||''; if(!ref||seenRef[ref]) continue; seenRef[ref]=1;
                  const dets=x.order_details||[]; let sq=0;
                  for(const it of dets){ items.push({ref:ref, seq:sq++, product_name:(it.product_name||'').slice(0,200), sku:it.sku||'', qty:Number(it.quantity)||0, price:Number(it.base_price)||0, order_date:d}); }
                }
                p++;
              } }
            // self-heal 3 hari terakhir aja: hapus 3 hari lalu insert (histori >3 hari TIDAK disentuh)
            await fetch(SUPA+'/rest/v1/iseller_order_items?order_date=gte.'+iCut,{method:'DELETE',headers:SH});
            for(let i=0;i<items.length;i+=500){ const ch=items.slice(i,i+500); await fetch(SUPA+'/rest/v1/iseller_order_items',{method:'POST',headers:{...SH,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(ch)}); }
            console.log('OK items: '+items.length+' produk (refresh 3 hari sejak '+iCut+', '+Object.keys(seenRef).length+' struk)');
          }catch(e){ console.error('items pass gagal (dilewati):', e.message); }
          } // tutup guard: skip refund/grab/items kalau rekonsiliasi bulan lampau (fullEnd)
          EOF
          node sync.mjs
